<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Avatar ilustrado de Felipe Ferreira">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset=".45" stop-color="#f97316"/>
      <stop offset="1" stop-color="#9a3412"/>
    </linearGradient>
    <radialGradient id="pele" cx=".42" cy=".35" r=".75">
      <stop offset="0" stop-color="#c08560"/>
      <stop offset=".6" stop-color="#a96f4a"/>
      <stop offset="1" stop-color="#8e5838"/>
    </radialGradient>
    <linearGradient id="pescoco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e4129"/>
      <stop offset=".5" stop-color="#93603f"/>
    </linearGradient>
    <linearGradient id="camisa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c0c0e"/>
      <stop offset=".5" stop-color="#232327"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
    <linearGradient id="barba" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1c14"/>
      <stop offset="1" stop-color="#140d09"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a110c" stop-opacity=".9"/>
      <stop offset="1" stop-color="#1f150f" stop-opacity=".92"/>
    </linearGradient>
    <clipPath id="circ"><circle cx="200" cy="200" r="200"/></clipPath>
    <clipPath id="rosto">
      <path d="M128 150 C128 104 160 84 200 84 C240 84 272 104 272 150 L272 196 C272 252 240 288 200 288 C160 288 128 252 128 196 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circ)">
    <rect width="400" height="400" fill="url(#bg)"/>
    <circle cx="200" cy="185" r="160" fill="#fff" opacity=".07"/>
    <circle cx="200" cy="185" r="120" fill="#fff" opacity=".06"/>

    <!-- Camiseta -->
    <path d="M18 400 C26 334 84 306 150 296 L250 296 C316 306 374 334 382 400 Z" fill="url(#camisa)"/>
    <path d="M70 340 C90 330 110 324 130 320" stroke="#2f2f35" stroke-width="3" fill="none" opacity=".7"/>
    <path d="M330 340 C310 330 290 324 270 320" stroke="#2f2f35" stroke-width="3" fill="none" opacity=".7"/>

    <!-- Pescoço -->
    <path d="M164 262 L236 262 L242 304 L200 344 L158 304 Z" fill="url(#pescoco)"/>
    <!-- Gola V -->
    <path d="M148 296 L200 350 L252 296 L242 296 L200 338 L158 296 Z" fill="#2e2e33"/>

    <!-- Logo da camiseta -->
    <g transform="translate(82 360) rotate(-5)" fill="#e4e4e7">
      <path d="M30 -20 C34 -29 46 -29 50 -20 C44 -23 36 -23 30 -20 Z"/>
      <path d="M40 -24 L40 -14" stroke="#e4e4e7" stroke-width="1.5"/>
      <text x="0" y="4" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="21" letter-spacing="1">PERSONAL</text>
      <text x="44" y="16" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="7" fill="#a1a1aa" letter-spacing="2.5">TRAINER</text>
    </g>

    <!-- Orelhas -->
    <g>
      <path d="M130 172 C114 168 110 190 116 206 C120 218 128 222 134 220 Z" fill="#9b6342"/>
      <path d="M128 182 C120 182 120 198 126 208" stroke="#74462c" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M270 172 C286 168 290 190 284 206 C280 218 272 222 266 220 Z" fill="#8e5838"/>
      <path d="M272 182 C280 182 280 198 274 208" stroke="#6a3f27" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Rosto -->
    <path d="M128 150 C128 104 160 84 200 84 C240 84 272 104 272 150 L272 196 C272 252 240 288 200 288 C160 288 128 252 128 196 Z" fill="url(#pele)"/>

    <g clip-path="url(#rosto)">
      <!-- Brilho na testa e bochecha -->
      <ellipse cx="182" cy="136" rx="30" ry="10" fill="#d49a73" opacity=".35"/>
      <ellipse cx="160" cy="200" rx="14" ry="9" fill="#cf8f68" opacity=".35"/>

      <!-- Degradê nas laterais -->
      <path d="M120 100 L150 104 C143 124 140 150 142 186 L120 186 Z" fill="url(#fade)"/>
      <path d="M280 100 L250 104 C257 124 260 150 258 186 L280 186 Z" fill="url(#fade)"/>

      <!-- Barba (linha da bochecha marcada) -->
      <path d="M120 182 L142 182 C146 204 156 220 170 228 C184 222 216 222 230 228 C244 220 254 204 258 182 L280 182 L280 310 L120 310 Z" fill="url(#barba)"/>
      <!-- Contorno degradê da barba na bochecha -->
      <path d="M142 182 C146 204 156 220 170 228" stroke="#3a281d" stroke-width="4" fill="none" opacity=".5"/>
      <path d="M258 182 C254 204 244 220 230 228" stroke="#3a281d" stroke-width="4" fill="none" opacity=".5"/>
    </g>

    <!-- Cabelo crespo curto no topo -->
    <g fill="#18100b">
      <path d="M140 122 C136 88 160 64 200 62 C240 64 264 88 260 122 C244 108 222 104 200 104 C178 104 156 108 140 122 Z"/>
    </g>
    <g fill="#18100b">
      <circle cx="150" cy="102" r="11"/><circle cx="160" cy="86" r="12"/><circle cx="174" cy="74" r="12"/>
      <circle cx="190" cy="67" r="12"/><circle cx="208" cy="66" r="12"/><circle cx="225" cy="71" r="12"/>
      <circle cx="240" cy="83" r="12"/><circle cx="250" cy="99" r="11"/>
      <circle cx="146" cy="116" r="8"/><circle cx="254" cy="116" r="8"/>
    </g>
    <!-- Textura dos cachos -->
    <g fill="none" stroke="#3b2a1f" stroke-width="2.2" stroke-linecap="round">
      <path d="M160 92 a5 5 0 1 1 8 -4"/><path d="M178 80 a5 5 0 1 1 8 -4"/><path d="M196 74 a5 5 0 1 1 8 -4"/>
      <path d="M214 74 a5 5 0 1 1 8 -4"/><path d="M231 82 a5 5 0 1 1 8 -4"/>
      <path d="M168 104 a4 4 0 1 1 7 -3"/><path d="M186 94 a4 4 0 1 1 7 -3"/><path d="M204 92 a4 4 0 1 1 7 -3"/>
      <path d="M222 96 a4 4 0 1 1 7 -3"/><path d="M152 108 a4 4 0 1 1 6 -3"/><path d="M240 106 a4 4 0 1 1 6 -3"/>
    </g>

    <!-- Sobrancelhas -->
    <path d="M150 150 C160 140 178 138 190 144 C191 147 190 150 188 151 C176 147 164 149 152 156 Z" fill="#18100b"/>
    <path d="M250 150 C240 140 222 138 210 144 C209 147 210 150 212 151 C224 147 236 149 248 156 Z" fill="#18100b"/>

    <!-- Olhos (sorrindo, levemente fechados) -->
    <g>
      <path d="M156 170 C163 162 181 161 189 169 C181 174 165 175 156 170 Z" fill="#f4ede6"/>
      <circle cx="173" cy="168" r="6" fill="#3a2215"/>
      <circle cx="173" cy="168" r="3" fill="#120a06"/>
      <circle cx="175.5" cy="166" r="1.7" fill="#fff"/>
      <path d="M154 171 C162 160 182 159 191 169" stroke="#18100b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M159 177 C167 180 178 180 186 176" stroke="#7a4a2e" stroke-width="2" fill="none" stroke-linecap="round"/>

      <path d="M244 170 C237 162 219 161 211 169 C219 174 235 175 244 170 Z" fill="#f4ede6"/>
      <circle cx="227" cy="168" r="6" fill="#3a2215"/>
      <circle cx="227" cy="168" r="3" fill="#120a06"/>
      <circle cx="229.5" cy="166" r="1.7" fill="#fff"/>
      <path d="M246 171 C238 160 218 159 209 169" stroke="#18100b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M241 177 C233 180 222 180 214 176" stroke="#7a4a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Nariz -->
    <path d="M197 170 C196 182 193 192 190 198" stroke="#8a5434" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/>
    <path d="M180 204 C182 194 190 192 194 196 C197 192 203 192 206 196 C210 192 218 194 220 204 C216 212 208 213 204 209 C201 211 199 211 196 209 C192 213 184 212 180 204 Z" fill="#a36945"/>
    <ellipse cx="190" cy="206" rx="4" ry="2.6" fill="#5a3320"/>
    <ellipse cx="210" cy="206" rx="4" ry="2.6" fill="#5a3320"/>
    <ellipse cx="203" cy="198" rx="5" ry="3" fill="#c99069" opacity=".6"/>

    <!-- Bigode -->
    <path d="M166 228 C172 216 188 214 200 219 C212 214 228 216 234 228 C236 234 230 236 224 232 C214 226 206 226 200 228 C194 226 186 226 176 232 C170 236 164 234 166 228 Z" fill="#18100b"/>

    <!-- Boca sorrindo -->
    <path d="M174 236 C184 258 216 258 226 236 C214 240 186 240 174 236 Z" fill="#5a1f1a"/>
    <path d="M176 237 C188 241 212 241 224 237 C221 244 212 247 200 247 C188 247 179 244 176 237 Z" fill="#fbfaf7"/>
    <path d="M186 240 L186 246 M200 241 L200 247 M214 240 L214 246" stroke="#e7e2da" stroke-width="1.2"/>
    <path d="M186 254 C194 258 206 258 214 254 C208 258 192 258 186 254 Z" fill="#7a3a2c"/>

    <!-- Queixo / cavanhaque -->
    <path d="M186 262 C194 265 206 265 214 262 C213 273 207 280 200 280 C193 280 187 273 186 262 Z" fill="#0d0805" opacity=".6"/>
    <!-- Brilho sutil da barba -->
    <path d="M152 236 C158 254 170 268 186 276" stroke="#3a281d" stroke-width="2" fill="none" opacity=".5"/>
    <path d="M248 236 C242 254 230 268 214 276" stroke="#3a281d" stroke-width="2" fill="none" opacity=".5"/>
  </g>
</svg>
