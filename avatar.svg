    <path d="M182 206 C186 214 194 216 200 213 C206 216 214 214 218 206 C214 209 208 208 204 206 C201 208 199 208 196 206 C192 208 186 209 182 206 Z" fill="#7a4a2e"/>
    <ellipse cx="200" cy="203" rx="14" ry="8" fill="#b97a53" opacity="0.6"/>

    <!-- Barba cheia -->
    <path d="M138 196 C140 222 146 236 154 246 C160 232 170 226 184 226 L216 226 C230 226 240 232 246 246 C254 236 260 222 262 196 C264 250 238 290 200 292 C162 290 136 250 138 196 Z" fill="#1c130e"/>
    <!-- Bigode -->
    <path d="M172 226 C180 216 194 216 200 221 C206 216 220 216 228 226 C232 232 226 236 220 232 C212 228 206 228 200 230 C194 228 188 228 180 232 C174 236 168 232 172 226 Z" fill="#1c130e"/>
    <!-- Boca sorrindo -->
    <path d="M176 238 C186 254 214 254 224 238 C214 242 186 242 176 238 Z" fill="#ffffff"/>
    <path d="M176 238 C186 256 214 256 224 238" fill="none" stroke="#5a2e1e" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Cavanhaque / volume do queixo -->
    <path d="M186 258 C192 262 208 262 214 258 C212 270 206 276 200 276 C194 276 188 270 186 258 Z" fill="#2a1d16"/>
  </g>
</svg>
