    <path d="M212 172 C219 164 233 164 240 172 C233 176 219 176 212 172 Z" fill="#ffffff"/>
    <circle cx="175" cy="170" r="5.5" fill="#2a1a12"/>
    <circle cx="226" cy="170" r="5.5" fill="#2a1a12"/>
    <circle cx="177" cy="168" r="1.6" fill="#ffffff"/>
    <circle cx="228" cy="168" r="1.6" fill="#ffffff"/>
    <path d="M158 172 C166 162 182 162 190 172" fill="none" stroke="#1c130e" stroke-width="3" stroke-linecap="round"/>
    <path d="M210 172 C218 162 234 162 242 172" fill="none" stroke="#1c130e" stroke-width="3" stroke-linecap="round"/>
    <path d="M163 180 C170 183 180 183 186 180" fill="none" stroke="#8a5636" stroke-width="2" stroke-linecap="round"/>
    <path d="M214 180 C220 183 230 183 237 180" fill="none" stroke="#8a5636" stroke-width="2" stroke-linecap="round"/>

    <!-- Nariz -->
