<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Avatar ilustrado de Felipe Ferreira">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <clipPath id="circ"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>

  <g clip-path="url(#circ)">
    <rect width="400" height="400" fill="url(#bg)"/>
    <circle cx="200" cy="170" r="150" fill="#ffffff" opacity="0.08"/>

    <!-- Tronco / camiseta preta -->
    <path d="M40 400 C48 330 100 300 150 292 L250 292 C300 300 352 330 360 400 Z" fill="#18181b"/>
    <!-- Pescoço -->
    <path d="M168 250 L232 250 L238 300 C220 318 180 318 162 300 Z" fill="#8a5636"/>
    <!-- Gola V -->
    <path d="M150 292 L200 340 L250 292 L238 292 L200 326 L162 292 Z" fill="#27272a"/>
    <path d="M162 292 L200 326 L238 292 C232 300 216 314 200 318 C184 314 168 300 162 292 Z" fill="#7a4a2e"/>
    <!-- Logo da camiseta -->
    <g transform="translate(92 352) rotate(-4)">
      <path d="M22 -16 C26 -24 36 -24 40 -16 C34 -19 28 -19 22 -16 Z" fill="#e4e4e7"/>
      <text x="0" y="6" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="19" fill="#e4e4e7" letter-spacing="1">PERSONAL</text>
      <text x="40" y="17" font-family="Montserrat, Arial, sans-serif" font-weight="600" font-size="6.5" fill="#a1a1aa" letter-spacing="2">TRAINER</text>
    </g>

    <!-- Orelhas -->
    <ellipse cx="128" cy="190" rx="14" ry="22" fill="#9a6340"/>
    <ellipse cx="272" cy="190" rx="14" ry="22" fill="#9a6340"/>
    <ellipse cx="130" cy="191" rx="6" ry="12" fill="#7a4a2e"/>
    <ellipse cx="270" cy="191" rx="6" ry="12" fill="#7a4a2e"/>

    <!-- Rosto -->
    <path d="M138 140 C138 100 165 84 200 84 C235 84 262 100 262 140 L262 205 C262 258 232 284 200 284 C168 284 138 258 138 205 Z" fill="#a86d48"/>
    <!-- Sombra lateral -->
    <path d="M240 110 C258 122 262 140 262 160 L262 205 C262 240 248 262 230 274 C246 244 250 200 246 160 C244 138 242 122 240 110 Z" fill="#94603d" opacity="0.7"/>

    <!-- Cabelo: degradê nas laterais -->
    <path d="M138 175 C134 140 140 112 156 98 L160 150 C150 156 144 164 142 178 Z" fill="#2a1d16" opacity="0.85"/>
    <path d="M262 175 C266 140 260 112 244 98 L240 150 C250 156 256 164 258 178 Z" fill="#2a1d16" opacity="0.85"/>
