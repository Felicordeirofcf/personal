      <circle cx="154" cy="96" r="15"/><circle cx="170" cy="74" r="17"/><circle cx="192" cy="62" r="18"/>
      <circle cx="215" cy="62" r="18"/><circle cx="236" cy="74" r="17"/><circle cx="250" cy="96" r="15"/>
      <circle cx="160" cy="114" r="11"/><circle cx="244" cy="114" r="11"/>
      <circle cx="182" cy="84" r="14"/><circle cx="204" cy="80" r="15"/><circle cx="226" cy="86" r="14"/>
    </g>
    <g fill="#33241b">
      <circle cx="176" cy="70" r="5"/><circle cx="200" cy="60" r="5"/><circle cx="222" cy="66" r="5"/>
      <circle cx="160" cy="92" r="4"/><circle cx="242" cy="90" r="4"/><circle cx="190" cy="82" r="4"/><circle cx="214" cy="80" r="4"/>
    </g>

    <!-- Sobrancelhas -->
